<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Smooth Scroll Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        html {
            background: #000;
        }

        body {
            /* page height determines how long the animation lasts */
            height: 600vh;
            background: transparent;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            /* CSS size always fills the viewport */
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-family: system-ui, -apple-system, sans-serif;
            /* clamp: readable on phones, not huge on desktop */
            font-size: clamp(14px, 4vw, 22px);
            font-weight: 300;
            letter-spacing: 4px;
            white-space: nowrap;
            z-index: 100;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading">LOADING 0%</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas  = document.getElementById('canvas');
        const ctx     = canvas.getContext('2d');
        const loading = document.getElementById('loading');

        const FRAME_COUNT = 300;

        // ── Hi-DPI / Retina / Mobile OLED support ───────────────────────────
        // Canvas pixel buffer is DPR times the CSS size so images stay sharp
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width  = window.innerWidth  * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // scale all draws by DPR
        }
        resizeCanvas();

        window.addEventListener('resize', () => {
            resizeCanvas();
            renderFrame(); // redraw immediately after resize
        });

        // ── Frame path helper ────────────────────────────────────────────────
        function frameSrc(n) {
            return `./images/ezgif-frame-${String(n).padStart(3, '0')}.jpg`;
        }

        // ── object-fit: cover draw (works for any aspect ratio / device) ────
        function drawCover(img) {
            if (!img || !img.naturalWidth) return;

            // Use CSS pixel dimensions for the math so DPR doesn't distort
            const cw = window.innerWidth;
            const ch = window.innerHeight;
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;

            const scale = Math.max(cw / iw, ch / ih);
            const dx = (cw - iw * scale) / 2;
            const dy = (ch - ih * scale) / 2;

            ctx.clearRect(0, 0, cw, ch);
            ctx.drawImage(img, dx, dy, iw * scale, ih * scale);
        }

        // ── Pre-load all frames ──────────────────────────────────────────────
        const frames = new Array(FRAME_COUNT).fill(null);
        let loaded   = 0;

        function onLoad(frameIndex, img) {
            frames[frameIndex] = img;
            loaded++;

            loading.textContent = `LOADING ${Math.round((loaded / FRAME_COUNT) * 100)}%`;

            // Show the very first frame as soon as it's decoded
            if (frameIndex === 0) drawCover(img);

            if (loaded === FRAME_COUNT) {
                loading.style.opacity = '0';
                setTimeout(() => { loading.style.display = 'none'; }, 700);
                tick(); // kick off the animation loop
            }
        }

        for (let i = 0; i < FRAME_COUNT; i++) {
            const img = new Image();
            const idx = i; // capture for closure
            img.onload  = () => onLoad(idx, img);
            img.onerror = () => onLoad(idx, img); // skip broken frames gracefully
            img.src = frameSrc(i + 1);            // files are 001 … 300
        }

        // ── Scroll → target frame ────────────────────────────────────────────
        let currentIndex = 0; // interpolated float
        let targetIndex  = 0; // set from scroll position

        function onScroll() {
            const maxScroll = document.body.scrollHeight - window.innerHeight;
            if (maxScroll <= 0) return;
            const fraction = Math.max(0, Math.min(1, window.scrollY / maxScroll));
            targetIndex = fraction * (FRAME_COUNT - 1);
        }

        // Both desktop wheel and mobile touch scrolling fire this
        window.addEventListener('scroll', onScroll, { passive: true });

        // ── Smooth render loop (lerp) ────────────────────────────────────────
        function renderFrame() {
            const clamped = Math.max(0, Math.min(FRAME_COUNT - 1, Math.round(currentIndex)));
            if (frames[clamped]) drawCover(frames[clamped]);
        }

        function tick() {
            currentIndex += (targetIndex - currentIndex) * 0.10;
            renderFrame();
            requestAnimationFrame(tick);
        }
    </script>

</body>
</html>
